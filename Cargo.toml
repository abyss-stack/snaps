[package]
name = "snaps"
version = "0.1.0"
edition = "2024"

[dependencies]
btrfs-uapi = "0.13.0"
clap = { version = "4.6.4", features = ["derive"] }
crc32fast = "1.5.0"
nix = { version = "0.31.3", features = ["fs", "user"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
